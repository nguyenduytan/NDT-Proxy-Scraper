name: Update proxy lists

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scrape proxy sources
        run: |
          python scripts/main.py --timeout 15 \
            --source 'http|https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&protocol=http&proxy_format=ipport&format=text' \
            --source 'http|https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt' \
            --source 'http|https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/http/data.txt' \
            --source 'http|https://raw.githubusercontent.com/r00tee/Proxy-List/main/http.txt' \
            --source 'http|https://raw.githubusercontent.com/zloi-user/hideip.me/main/http.txt' \
            --source 'http|https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt' \
            --source 'http|https://raw.githubusercontent.com/monosans/proxy-list/main/proxies_anonymous/http.txt' \
            --source 'http|https://raw.githubusercontent.com/gproxynet/free-proxy-list/main/http.txt' \
            --source 'http|https://raw.githubusercontent.com/hproxy-com/free-proxy-list/main/http.txt' \
            --source 'http|https://api.openproxylist.xyz/http.txt' \
            --source 'http|https://www.proxyscan.io/download?type=http' \
            --source 'http|https://www.proxyscan.io/download?type=https' \
            --source 'http|https://www.sslproxies.org/' \
            --source 'http|https://free-proxy-list.net/' \
            --source 'http|https://us-proxy.org/' \
            --source 'http|https://api.proxynova.com/proxylist' \
            --source 'http|https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000&country=all&ssl=all&anonymity=all' \
            --source 'socks4|https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&protocol=socks4&proxy_format=ipport&format=text' \
            --source 'socks4|https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks4.txt' \
            --source 'socks4|https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/socks4/data.txt' \
            --source 'socks4|https://raw.githubusercontent.com/r00tee/Proxy-List/main/socks4.txt' \
            --source 'socks4|https://raw.githubusercontent.com/zloi-user/hideip.me/main/socks4.txt' \
            --source 'socks4|https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks4.txt' \
            --source 'socks4|https://raw.githubusercontent.com/monosans/proxy-list/main/proxies_anonymous/socks4.txt' \
            --source 'socks4|https://raw.githubusercontent.com/gproxynet/free-proxy-list/main/socks4.txt' \
            --source 'socks4|https://raw.githubusercontent.com/hproxy-com/free-proxy-list/main/socks4.txt' \
            --source 'socks4|https://api.openproxylist.xyz/socks4.txt' \
            --source 'socks4|https://www.proxyscan.io/download?type=socks4' \
            --source 'socks4|https://www.socks-proxy.net/' \
            --source 'socks4|https://api.proxyscrape.com/v2/?request=displayproxies&protocol=socks4&timeout=10000&country=all&ssl=all&anonymity=all' \
            --source 'socks5|https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&protocol=socks5&proxy_format=ipport&format=text' \
            --source 'socks5|https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt' \
            --source 'socks5|https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/socks5/data.txt' \
            --source 'socks5|https://raw.githubusercontent.com/r00tee/Proxy-List/main/socks5.txt' \
            --source 'socks5|https://raw.githubusercontent.com/zloi-user/hideip.me/main/socks5.txt' \
            --source 'socks5|https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt' \
            --source 'socks5|https://raw.githubusercontent.com/monosans/proxy-list/main/proxies_anonymous/socks5.txt' \
            --source 'socks5|https://raw.githubusercontent.com/gproxynet/free-proxy-list/main/socks5.txt' \
            --source 'socks5|https://raw.githubusercontent.com/hproxy-com/free-proxy-list/main/socks5.txt' \
            --source 'socks5|https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt' \
            --source 'socks5|https://api.openproxylist.xyz/socks5.txt' \
            --source 'socks5|https://www.proxyscan.io/download?type=socks5' \
            --source 'socks5|https://api.proxyscrape.com/v2/?request=displayproxies&protocol=socks5&timeout=10000&country=all&ssl=all&anonymity=all'
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http.txt socks4.txt socks5.txt README.md
          git diff --cached --quiet || git commit -m "chore: update proxy lists"
          git push
